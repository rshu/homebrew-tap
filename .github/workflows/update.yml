name: Update formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable PyPI version (for example 0.3.1)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - name: Generate checksummed wheel resources
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --with packaging==26.2 python .github/scripts/update_formula.py --version "$RELEASE_VERSION"
      - name: Prepare and test release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet -- Formula/trajviz.rb; then
            echo "Formula is already current."
            exit 0
          fi
          branch="codex/trajviz-$RELEASE_VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "An update branch already exists: $branch"
            git fetch --no-tags origin "refs/heads/$branch"
            branch_formula="$RUNNER_TEMP/existing-trajviz.rb"
            if ! git show FETCH_HEAD:Formula/trajviz.rb > "$branch_formula"; then
              echo "::error::Existing release branch $branch has no formula. Review or remove it before retrying."
              exit 1
            fi
            if ! cmp -s Formula/trajviz.rb "$branch_formula"; then
              echo "::error::Existing release branch $branch differs from the freshly generated formula. Review or remove it before retrying."
              exit 1
            fi
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/trajviz.rb
            git commit -m "trajviz $RELEASE_VERSION"
            git push origin "$branch"
          fi
          gh workflow run test.yml --ref "$branch"
          printf 'Prepared release branch: %s/tree/%s\n\nReview the branch and passing Test formula run, then merge it into main.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
