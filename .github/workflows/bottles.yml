name: Build bottles

on:
  push:
    branches: ["codex/trajviz-bottle-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ASK: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      FORMULA: rshu/tap/trajviz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add Homebrew to PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Register local tap
        run: |
          brew tap --custom-remote rshu/tap "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula "$FORMULA"
          fi
      - name: Build bottle
        run: |
          brew style Formula/trajviz.rb
          brew install --build-bottle "$FORMULA"
          pkg_version="$(brew info --json=v2 "$FORMULA" | jq -er '
            .formulae[0] | .versions.stable +
            (if .revision > 0 then "_" + (.revision | tostring) else "" end)')"
          mkdir -p "$RUNNER_TEMP/trajviz-bottles/release"
          cd "$RUNNER_TEMP/trajviz-bottles"
          rebuild=()
          if brew info --json=v2 "$FORMULA" | jq -e '(.formulae[0].bottle.stable.files // {}) | length == 0'; then
            rebuild=(--no-rebuild)
          fi
          brew bottle --json "${rebuild[@]}" \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/trajviz-$pkg_version" "$FORMULA"
      - name: Install and test the bottled keg
        run: |
          cd "$RUNNER_TEMP/trajviz-bottles"
          metadata=(trajviz--*.bottle.json)
          test "${#metadata[@]}" -eq 1
          python3 - "${metadata[0]}" "$(brew --repository rshu/tap)/Formula/trajviz.rb" <<'PYTHON'
          import json
          import os
          import re
          import shutil
          import sys
          from pathlib import Path

          bottle = json.loads(Path(sys.argv[1]).read_text())[os.environ["FORMULA"]]["bottle"]
          ((tag, entry),) = bottle["tags"].items()
          release = Path("release").resolve()
          shutil.copyfile(entry["local_filename"], release / entry["filename"])

          cellar = bottle["cellar"]
          cellar_arg = f":{cellar}" if cellar in {"any", "any_skip_relocation"} else json.dumps(cellar)
          block = ["  bottle do", f'    root_url "{release.as_uri()}"']
          if bottle["rebuild"]:
              block.append(f'    rebuild {bottle["rebuild"]}')
          block.extend([f'    sha256 cellar: {cellar_arg}, {tag}: "{entry["sha256"]}"', "  end", ""])

          formula = Path(sys.argv[2])
          source = re.sub(r"^  bottle do\n.*?^  end\n\n", "", formula.read_text(), flags=re.M | re.S)
          before = '  depends_on "libyaml"\n'
          if source.count(before) != 1:
              raise ValueError("Could not locate where to insert the bottle block")
          formula.write_text(source.replace(before, "\n".join(block) + "\n" + before, 1))
          PYTHON
          brew uninstall "$FORMULA"
          brew install "$FORMULA"
          brew info --json=v2 "$FORMULA" | jq -e '.formulae[0].installed | any(.poured_from_bottle == true)'
          brew test "$FORMULA"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/trajviz-bottles/release/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trajviz-bottle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/trajviz-bottles/*.bottle.json
            ${{ runner.temp }}/trajviz-bottles/release/*.tar.gz
          if-no-files-found: error
